name: Build extension APK

# Builds the release APK on every push to main. Pushing a tag like v1.0.0
# additionally publishes a GitHub Release with the signed APK attached —
# that is the URL index.json points at for in-app installs/updates.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        # The ubuntu runner image already ships an Android SDK with
        # pre-accepted licenses. android-actions/setup-android@v3 is
        # unmaintained and its license-acceptance step hangs on current
        # cmdline-tools, so we use the preinstalled SDK directly.
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin:$SDK/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -E "platforms;android-34|build-tools" || true

      - name: Restore release keystore
        # Only runs when the KEYSTORE_BASE64 secret exists (see README.md
        # "Signing the release APK"). Without it the build still succeeds
        # but the APK is unsigned.
        # NOTE: the `secrets` context cannot be used in `if:` expressions —
        # GitHub rejects the workflow at parse time. Read it through `env`.
        # The keystore is PKCS#12, so it is written with a .p12 extension —
        # AGP infers the store type from the extension.
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Set up Gradle
        # No Gradle wrapper is committed yet (the wrapper jar is a binary that
        # must be generated once with `gradle wrapper` and committed). Until
        # then, install the pinned Gradle version directly. Do NOT change this
        # to a floating version: AGP 8.7.3 needs Gradle >= 8.9 and the project
        # targets 8.10.2.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sacred-texts-library-extension
          path: extension/build/outputs/apk/release/*.apk

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: sacred-texts-library-extension
          path: dist

      - name: Rename APK to the file name index.json expects
        run: mv dist/*.apk dist/sacred-texts-library.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sacred-texts-library.apk
          generate_release_notes: true
