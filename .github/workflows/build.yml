name: Build extension APK

# Builds the release APK on every push to main. The APK is uploaded as a
# workflow artifact; publishing it to a GitHub Release (which index.json
# points at) is a separate manual step until release automation is added.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        # Only runs when the KEYSTORE_BASE64 secret exists (see README.md
        # "Signing the release APK"). Without it the build still succeeds
        # but the APK is unsigned.
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Set up Gradle
        # No Gradle wrapper is committed yet (the wrapper jar is a binary that
        # must be generated once with `gradle wrapper` and committed). Until
        # then, install the pinned Gradle version directly. Do NOT change this
        # to a floating version: AGP 8.7.3 needs Gradle >= 8.9 and the project
        # targets 8.10.2.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sacred-texts-library-extension
          path: extension/build/outputs/apk/release/*.apk
